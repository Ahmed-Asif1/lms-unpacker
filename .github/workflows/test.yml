name: Test and package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Integration tests
        shell: ${{ matrix.shell }}
        run: ./tests/Run-Tests.ps1
      - name: Desktop control flows
        shell: ${{ matrix.shell }}
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File ./Start-Desktop.ps1 -SmokeTest
  package:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build portable release
        shell: pwsh
        run: ./Build-Release.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LMS-Unpacker
          path: dist/*
